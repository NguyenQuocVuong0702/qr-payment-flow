spring:
  application:
    name: qr-merchant
  datasource:
    url: jdbc:h2:file:./data/split/merchant;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
  sql:
    init:
      schema-locations: classpath:db/merchant.sql
server:
  port: 8182
app:
  merchant:
    gateway:
      base-url: ${QR_GATEWAY_BASE_URL:http://localhost:8181}
