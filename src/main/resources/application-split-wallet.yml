spring:
  application:
    name: qr-wallet
  datasource:
    url: jdbc:h2:file:./data/split/wallet;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
  sql:
    init:
      schema-locations: classpath:db/wallet.sql
server:
  port: 8183
app:
  wallet:
    gateway:
      base-url: ${QR_GATEWAY_BASE_URL:http://localhost:8181}
