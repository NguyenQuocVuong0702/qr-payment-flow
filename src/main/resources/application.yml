spring:
  application:
    name: qr-payment-flow
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  gateway:
    wallet:
      read-token: ${QR_WALLET_READ_TOKEN:wallet-read-token-dev-only}
  wallet:
    gateway:
      base-url: ${QR_GATEWAY_BASE_URL:http://localhost:${server.port}}
      read-token: ${QR_WALLET_READ_TOKEN:wallet-read-token-dev-only}
  merchant:
    id: MC001
    gateway:
      base-url: ${QR_GATEWAY_BASE_URL:http://localhost:${server.port}}
      secret-key: ${QR_MERCHANT_SECRET:secret-mc001}
logging:
  level:
    org.springframework.web: INFO
    org.springframework.http: INFO
    org.springframework.jdbc.datasource.init: INFO
